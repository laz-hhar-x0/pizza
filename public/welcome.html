<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root{--bg:#070808;--card:#0e1010;--line:#2a3030;--text:#ececec;--muted:#8a9292;--accent:#55A9A0;--on-accent:#041211;--error:#f0716b;--ok:#6fd49a;--glow:rgba(85,169,160,.28)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Inter","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:0;pointer-events:none}
body::before{width:480px;height:480px;top:-170px;right:-140px;background:radial-gradient(circle,rgba(85,169,160,.24),transparent 65%);animation:drift1 16s ease-in-out infinite}
body::after{width:420px;height:420px;bottom:-170px;left:-130px;background:radial-gradient(circle,rgba(85,169,160,.14),transparent 65%);animation:drift2 20s ease-in-out infinite}
@keyframes drift1{50%{transform:translate(-70px,90px)}}
@keyframes drift2{50%{transform:translate(80px,-70px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
label{display:block;margin:18px 0 2px;font-weight:500;font-size:13px;color:var(--muted)}
input{--track:#2a3030;width:100%;padding:11px 2px 13px;border:0;border-radius:0;background-color:transparent;background-image:linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--track),var(--track));background-repeat:no-repeat;background-size:0% 2px,100% 1.5px;background-position:left bottom,left bottom;background-origin:border-box;color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:background-size .35s ease}
input::placeholder{color:#4b5454}
input:focus{background-size:100% 2px,100% 1.5px;transition:background-size 1.6s cubic-bezier(.4,0,.2,1)}
input.invalid{--track:var(--error);animation:shake .35s}
input:-webkit-autofill{-webkit-text-fill-color:var(--text);caret-color:var(--text);transition:background-color 600000s 0s,color 600000s 0s,background-size 1.6s cubic-bezier(.4,0,.2,1)}
.err{color:var(--error);font-size:13px;min-height:18px;margin-top:4px}
.hidden{display:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(14,16,16,.78);backdrop-filter:blur(10px);border-bottom:1px solid #1a1e1e;animation:slideDown .5s ease both}
@keyframes slideDown{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
.menu-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,transform .15s}
.menu-btn:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.05)}
.topbar .title{font-size:18px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;height:100%;width:280px;max-width:82%;background:var(--card);border-right:1px solid #1a1e1e;z-index:40;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:20px 14px;box-shadow:10px 0 30px rgba(0,0,0,.6)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:0 6px}
.drawer-head b{font-size:18px}
.close-btn{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);transition:transform .25s,color .2s}
.close-btn:hover{color:var(--text);transform:rotate(90deg)}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;margin-bottom:6px;border:0;border-radius:12px;background:none;font-size:16px;font-family:inherit;color:var(--text);cursor:pointer;text-align:left;opacity:0;transform:translateX(-24px);transition:background .2s,opacity .35s,transform .35s}
.drawer.open .nav-item{opacity:1;transform:none}
.drawer.open .nav-item:nth-of-type(1){transition-delay:.08s}
.drawer.open .nav-item:nth-of-type(2){transition-delay:.14s}
.drawer.open .nav-item:nth-of-type(3){transition-delay:.2s}
.drawer.open .nav-item:nth-of-type(4){transition-delay:.26s}
.nav-item:hover{background:rgba(85,169,160,.1)}
.nav-item.active{background:rgba(85,169,160,.16);color:var(--accent);font-weight:700}
.nav-item.logout{color:var(--error);margin-top:auto}
.nav-item.logout:hover{background:rgba(240,113,107,.12)}
.nav-item .ic{font-size:20px;width:24px;text-align:center}
main{position:relative;z-index:1;padding:24px 16px 40px;display:flex;justify-content:center}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid #1a1e1e;border-radius:22px;padding:34px 28px;box-shadow:0 30px 60px rgba(0,0,0,.6);animation:rise .6s ease both}
.page{display:none}
.page.active{display:block;animation:rise .45s ease both}
.home{text-align:center;padding:20px 0}
.emoji{font-size:58px;display:inline-block;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-12px) scale(1.08)}}
.home h1{font-size:30px;margin:14px 0 8px;font-weight:700;word-break:break-word}
.home p{color:var(--muted);margin:0}
h2{margin:0 0 6px;font-size:22px;font-weight:700}
#pPhone{direction:ltr;text-align:left;background-position:left bottom,left bottom}
input[readonly]{color:var(--muted);cursor:not-allowed;background-size:0% 2px,100% 1.5px!important}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
.msg{font-size:14px;margin-top:12px;min-height:20px}
.msg.ok{color:var(--ok);animation:rise .3s ease both}
.msg.bad{color:var(--error)}
.btn{position:relative;overflow:hidden;width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .25s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 26px var(--glow);filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ripple{position:absolute;border-radius:50%;background:rgba(0,0,0,.25);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.contact-row{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-top:12px;text-decoration:none;color:var(--text);transition:transform .2s,border-color .2s;animation:rise .5s ease both}
a.contact-row:hover{transform:translateX(4px);border-color:var(--accent)}
.contact-row:nth-of-type(1){animation-delay:.05s}
.contact-row:nth-of-type(2){animation-delay:.12s}
.contact-row:nth-of-type(3){animation-delay:.19s}
.contact-row .ic{font-size:22px}
.contact-row small{display:block;color:var(--muted)}
.contact-row .val{direction:ltr;unicode-bidi:plaintext}
.confetti{position:fixed;top:-14px;width:8px;height:14px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
</style>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <span class="title" id="topTitle">Home</span>
  </header>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <b>Menu</b>
      <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
    </div>
    <button class="nav-item active" data-page="home"><span class="ic">🏠</span>Home</button>
    <button class="nav-item" data-page="profile"><span class="ic">👤</span>Profile</button>
    <button class="nav-item" data-page="contact"><span class="ic">📞</span>Contact us</button>
    <button class="nav-item logout" id="logout"><span class="ic">🚪</span>Sign out</button>
  </aside>

  <main>
    <div class="card">
      <!-- Home -->
      <section class="page home active" id="page-home">
        <div class="emoji">🎉</div>
        <h1 id="greeting">Welcome</h1>
        <p>We're glad to have you</p>
      </section>

      <!-- Profile -->
      <section class="page" id="page-profile">
        <h2>Profile</h2>
        <form id="profileForm" novalidate>
          <label for="pName">Name</label>
          <input id="pName" type="text" maxlength="50" autocomplete="name" />
          <div class="err" id="pNameErr"></div>

          <label for="pPhone">Phone number</label>
          <input id="pPhone" type="tel" readonly />
          <div class="hint">Your number can't be changed because it's the one we verified.</div>

          <button class="btn" type="submit" id="saveBtn">Save changes</button>
          <div class="msg" id="profileMsg"></div>
        </form>
      </section>

      <!-- Contact us -->
      <section class="page" id="page-contact">
        <h2>Contact us</h2>
        <a class="contact-row" href="mailto:lazhhar2@gmail.com">
          <span class="ic">✉️</span>
          <span><small>Email</small><span class="val">lazhhar2@gmail.com</span></span>
        </a>
        <a class="contact-row" href="tel:+213779791498">
          <span class="ic">📱</span>
          <span><small>Phone</small><span class="val">+213 779 79 14 98</span></span>
        </a>
        <div class="contact-row">
          <span class="ic">🕘</span>
          <span><small>Reply hours</small>Daily, 9:00 - 16:00</span>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    const $ = (id) => document.getElementById(id);
    let currentUser = null, burstDone = false;
    const titles = { home: 'Home', profile: 'Profile', contact: 'Contact us' };

    // ---------- القائمة الجانبية ----------
    function openDrawer() { $('drawer').classList.add('open'); $('overlay').classList.add('show'); $('drawer').setAttribute('aria-hidden', 'false'); }
    function closeDrawer() { $('drawer').classList.remove('open'); $('overlay').classList.remove('show'); $('drawer').setAttribute('aria-hidden', 'true'); }
    $('menuBtn').addEventListener('click', openDrawer);
    $('closeBtn').addEventListener('click', closeDrawer);
    $('overlay').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

    function showPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
      document.querySelectorAll('.nav-item[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === name));
      $('topTitle').textContent = titles[name] || '';
      closeDrawer();
    }
    document.querySelectorAll('.nav-item[data-page]').forEach(b => b.addEventListener('click', () => showPage(b.dataset.page)));

    // ---------- تحميل بيانات المستخدم ----------
    function fill(me) {
      $('greeting').textContent = 'Welcome, ' + me.name;
      $('pName').value = me.name;
      $('pPhone').value = me.phone || '';
    }
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = '/'; return; }
      currentUser = user;
      const snap = await getDoc(doc(db, 'users', user.uid));
      const d = snap.exists() ? snap.data() : {};
      fill({ name: d.name || user.displayName || 'friend', phone: d.phone || '' });
      if (!burstDone) { burstDone = true; burst(); }
    });

    // ---------- تعديل البروفايل ----------
    function setErr(inputId, errId, msg) {
      $(errId).textContent = msg || '';
      const el = $(inputId);
      el.classList.remove('invalid');
      if (msg) { void el.offsetWidth; el.classList.add('invalid'); }
    }
    $('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = $('pName').value.trim();
      setErr('pName', 'pNameErr', '');
      $('profileMsg').textContent = ''; $('profileMsg').className = 'msg';

      let ok = true;
      if (name.length < 2 || !/^[\p{L}\s'’-]+$/u.test(name)) { setErr('pName', 'pNameErr', 'Enter your name (at least 2 letters, letters only).'); ok = false; }
      if (!ok) return;

      const btn = $('saveBtn');
      btn.disabled = true;
      try {
        await updateDoc(doc(db, 'users', currentUser.uid), { name });
        $('greeting').textContent = 'Welcome, ' + name;
        $('profileMsg').textContent = '✅ Changes saved';
        $('profileMsg').className = 'msg ok';
      } catch {
        $('profileMsg').textContent = 'Could not save. Please try again.'; $('profileMsg').className = 'msg bad';
      }
      btn.disabled = false;
    });

    // ---------- Sign out ----------
    $('logout').addEventListener('click', async (e) => {
      e.currentTarget.disabled = true;
      try { await signOut(auth); } catch {}
      location.href = '/';
    });

    // ---------- Confetti ----------
    function burst() {
      const colors = ['#14b8a6', '#1d4ed8', '#facc15', '#f87171', '#a78bfa'];
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('i');
        p.className = 'confetti';
        p.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % 5]};` +
          `animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * .6}s`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 5000);
      }
    }

    // ---------- Ripple ----------
    document.addEventListener('click', (e) => {
      const b = e.target.closest('.btn');
      if (!b || b.disabled) return;
      const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
      const d = document.createElement('span');
      d.className = 'ripple';
      d.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s/2}px;top:${e.clientY - r.top - s/2}px`;
      b.appendChild(d);
      setTimeout(() => d.remove(), 600);
    });
  </script>
</body>
</html>
