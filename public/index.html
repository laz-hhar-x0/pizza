<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root{--bg:#070808;--card:#0e1010;--line:#2a3030;--text:#ececec;--muted:#8a9292;--accent:#55A9A0;--on-accent:#041211;--error:#f0716b;--ok:#6fd49a;--glow:rgba(85,169,160,.28)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Inter","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:0;pointer-events:none}
body::before{width:480px;height:480px;top:-170px;right:-140px;background:radial-gradient(circle,rgba(85,169,160,.24),transparent 65%);animation:drift1 16s ease-in-out infinite}
body::after{width:420px;height:420px;bottom:-170px;left:-130px;background:radial-gradient(circle,rgba(85,169,160,.14),transparent 65%);animation:drift2 20s ease-in-out infinite}
@keyframes drift1{50%{transform:translate(-70px,90px)}}
@keyframes drift2{50%{transform:translate(80px,-70px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
label{display:block;margin:18px 0 2px;font-weight:500;font-size:13px;color:var(--muted)}
input{--track:#2a3030;width:100%;padding:11px 2px 13px;border:0;border-radius:0;background-color:transparent;background-image:linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--track),var(--track));background-repeat:no-repeat;background-size:0% 2px,100% 1.5px;background-position:left bottom,left bottom;background-origin:border-box;color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:background-size .35s ease}
input::placeholder{color:#4b5454}
input:focus{background-size:100% 2px,100% 1.5px;transition:background-size 1.6s cubic-bezier(.4,0,.2,1)}
input.invalid{--track:var(--error);animation:shake .35s}
input:-webkit-autofill{-webkit-text-fill-color:var(--text);caret-color:var(--text);transition:background-color 600000s 0s,color 600000s 0s,background-size 1.6s cubic-bezier(.4,0,.2,1)}
.err{color:var(--error);font-size:13px;min-height:18px;margin-top:4px}
.hidden{display:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

body{display:flex;align-items:center;justify-content:center;padding:16px}
.card{position:relative;z-index:1;width:100%;max-width:410px;background:var(--card);border:1px solid #1a1e1e;border-radius:22px;padding:34px 28px 28px;box-shadow:0 30px 60px rgba(0,0,0,.6);animation:rise .6s ease both}
h1{margin:0 0 6px;font-size:25px;font-weight:700;text-align:center}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
.sub{margin:0 0 10px;text-align:center;color:var(--muted);font-size:14px}
form>*{animation:rise .55s ease both}
form>*:nth-child(1){animation-delay:.08s}form>*:nth-child(2){animation-delay:.14s}form>*:nth-child(3){animation-delay:.2s}
form>*:nth-child(4){animation-delay:.26s}form>*:nth-child(5){animation-delay:.32s}form>*:nth-child(6){animation-delay:.38s}
form>*:nth-child(7){animation-delay:.44s}form>*:nth-child(8){animation-delay:.5s}form>*:nth-child(9){animation-delay:.56s}
form>*:nth-child(10){animation-delay:.62s}
#email,#phone,#password,#code{direction:ltr;text-align:left;background-position:left bottom,left bottom}
button.main{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .25s,filter .2s}
button.main:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 26px var(--glow);filter:brightness(1.08)}
button.main:active:not(:disabled){transform:scale(.98)}
button.main:disabled{opacity:.5;cursor:not-allowed}
.foot{text-align:center;margin:20px 0 0;font-size:14px;color:var(--muted)}
.foot a{color:var(--accent);font-weight:700;text-decoration:none;background:linear-gradient(var(--accent),var(--accent)) no-repeat left bottom/0% 1.5px;transition:background-size .3s;padding-bottom:2px}
.foot a:hover{background-size:100% 1.5px}
.global-msg{text-align:center;font-size:14px;margin-top:12px;min-height:20px}
.global-msg.bad{color:var(--error)}
.global-msg.good{color:var(--ok)}
</style>
</head>
<body>
  <main class="card">
    <h1>❤️ Welcome ❤️ <span class="wave"></span></h1>
    <p class="sub">Sign in with your email or phone and password</p>

    <form id="form" novalidate>
      <label for="email">Email or phone</label>
      <input id="email" type="text" autocomplete="username" placeholder="lazhhar2@gmail.com / 077979" />
      <div class="err" id="emailErr"></div>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div class="err" id="passwordErr"></div>

      <button type="submit" class="main" id="loginBtn">Sign in</button>
      <div class="global-msg" id="globalMsg"></div>
    </form>

    <p class="foot">Don't have an account? <a href="/register.html">Create one</a></p>
  </main>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserSessionPersistence }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const $ = (id) => document.getElementById(id);

    function showErr(inputId, errId, msg) {
      $(errId).textContent = msg || '';
      const el = $(inputId);
      el.classList.remove('invalid');
      if (msg) { void el.offsetWidth; el.classList.add('invalid'); }
    }

    function firebaseMsg(code) {
      return ({
        'auth/invalid-credential': 'Incorrect email/phone or password.',
        'auth/user-not-found': 'Incorrect email/phone or password.',
        'auth/wrong-password': 'Incorrect email/phone or password.',
        'auth/invalid-email': 'Invalid email.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
        'auth/user-disabled': 'This account is disabled.',
        'auth/network-request-failed': 'Network problem. Please try again.',
      })[code] || 'Something went wrong. Please try again. (' + code + ')';
    }

    // already signed in (Firebase session) -> go straight to welcome
    onAuthStateChanged(auth, (user) => { if (user) location.href = '/welcome'; });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showErr('email', 'emailErr', ''); showErr('password', 'passwordErr', '');
      $('globalMsg').textContent = ''; $('globalMsg').className = 'global-msg';

      let email = $('email').value.trim();
      const password = $('password').value;
      let ok = true;
      const isPhone = /^\+?[0-9\s]{8,15}$/.test(email);
      if (!isPhone && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('email', 'emailErr', 'Invalid email or phone.'); ok = false; }
      if (!password) { showErr('password', 'passwordErr', 'Enter your password.'); ok = false; }
      if (!ok) return;

      const btn = $('loginBtn');
      const resetBtn = () => { btn.disabled = false; btn.textContent = 'Sign in'; };
      btn.disabled = true; btn.textContent = 'Signing in...';

      // phone number -> find the email linked to it (via server.js)
      if (isPhone) {
        try {
          const r = await fetch('/api/email-by-phone', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: email.replace(/\s+/g, '') })
          });
          const j = await r.json();
          if (!j.email) {
            showErr('email', 'emailErr', 'No account with this number.');
            resetBtn();
            return;
          }
          email = j.email;
        } catch {
          showErr('email', 'emailErr', 'Network problem. Please try again.');
          resetBtn();
          return;
        }
      }

      try {
        // session lasts only while the browser is open
        await setPersistence(auth, browserSessionPersistence);
        await signInWithEmailAndPassword(auth, email, password);
        $('globalMsg').textContent = '✅ Signed in';
        $('globalMsg').className = 'global-msg good';
        location.href = '/welcome';
      } catch (err) {
        $('globalMsg').textContent = firebaseMsg(err.code || String(err));
        $('globalMsg').className = 'global-msg bad';
        resetBtn();
      }
    });
  </script>
</body>
</html>
